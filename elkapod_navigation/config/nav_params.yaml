navigation/planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    costmap_update_timeout: 1.0
    introspection_mode: "disabled"
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner" # In Iron and older versions, "/" was used instead of "::"
      how_many_corners: 8

      # Weight applied on the length of the path.
      w_euc_cost: 5.0

      # It tunes how harshly the nodes of high cost are penalised.
      # From the above g(neigh) equation you can see that the cost-aware component of the cost function forms a parabolic curve,
      # thus this parameter would, on increasing its value,
      # make that curve steeper allowing for a greater differentiation (as the delta of costs would increase,
      # when the graph becomes steep) among the nodes of different costs.
      w_traversal_cost: 10.0
      allow_unknown: True

navigation/controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3
    odom_topic: "/icp_odom"
    odom_duration: 0.3
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "elkapod_straight_controller::ElkapodStraightController"
      debug_trajectory_details: True
      max_linear_vel: 0.2
      max_angular_vel: 1.0
      lookahead_dist: 2.0
      transform_tolerance: 1.0

