perception/fusion_ekf:
    ros__parameters:
        print_diagnostics: true
        debug: false
        use_sim_time: true

        frequency: 30.0
        sensor_timeout: 0.2
        two_d_mode: false

        publish_acceleration: true
        publish_tf: true

        odom_frame: odom
        map_frame: map             
        base_link_frame: base_link 
        world_frame: odom          

        odom0: /odometry/filtered
        odom0_config: [false, false, false,
                      false, false, false,
                      true, true, false, 
                      false, false, true,
                      false, false, false]

        odom1: /perception/icp_odom
        odom1_config: [true, true, true,
                      true, true, true,
                      false, false, false,
                      false, false, false,
                      false, false, false]